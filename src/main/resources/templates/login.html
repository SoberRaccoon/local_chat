<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="UTF-8">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/login.css">
<script src="js/login.js" defer></script>
</head>
<body>
    <form id="login-form">
        <div class="login_div">
            <label style="font-size: 1.6em; margin-bottom: 15px;"> Login </label>
            <label id="login_error"></label>
            <input id="username" class="login_input" placeholder="username">
            <input type="password" id="password" class="login_input" placeholder="password">
            <a href="#" id="signup-link">Sign up</a>
            <button type="submit" id="login_button" class="login_button" >Log in</button>
        </div>
    </form>
</body>
</html>
