
plugins {
	id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

apply plugin: 'io.spring.dependency-management'

group = 'com.local_chat'
version = '0.0.1-SNAPSHOT'

def minimumJavaVersion = JavaVersion.VERSION_21

if (!JavaVersion.current().isCompatibleWith(minimumJavaVersion)) {
    throw new GradleException(
        "Java ${minimumJavaVersion} or newer is required. " +
        "Current version: ${JavaVersion.current()}"
    )
}

test {
    testLogging {
        events "failed", "passed", "skipped", "standardOut", "standardError"
        showExceptions = true
        showCauses = true
        showStackTraces = true
        failFast = true
        exceptionFormat = 'FULL'
    }
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.xerial:sqlite-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
